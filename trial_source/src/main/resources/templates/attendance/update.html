<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>


	<div class="row">
		<div class="bs-component col-sm-12">

			<!-- objectを追加 宮城真奈 - Task27 -->
			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">

				<!-- 入力エラーがあった場合メッセージ表示 宮城真奈 - Task27 -->
				<th:block th:if="${#fields.hasErrors('*')}" id="error">
					<ul style="padding-left: 0; list-style: none;">
						<li th:each="error : ${#fields.errors('*')}" th:if="${error != ''}">
							<span th:text="'*' + '&nbsp' + ${error}" class="help-inline error"></span>
						</li>
					</ul>
				</th:block>


			<!-- 一覧のスクロール表示 宮城真奈 - Task.29 -->
			<div style="height: 700px; overflow-y: auto;">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<!-- 定時ボタン列確保 宮城真奈 - Task.28 -->
							<th class="w70"></th>
							<th class="w70">出勤</th>
							<th class="w70">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!-- 定時ボタン 宮城真奈 - Task.28 -->
								<td class="w70">
										<button type="button" class="btn btn-success default-button"
											th:onclick="|setDefaultTime(${stat.index})|">
											定時
										</button>
									</td>
								

								<!-- 出勤時間の時のプルダウン表 宮城真奈 - Task26 -->
								<td class="w120" style="white-space: nowrap;">

									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')} ? 'form-control errorInput' : 'form-control'"
										style="width: 60px; display: inline-block; padding: 0 2px;">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
											[[${hour.value}]]
										</option>
									</select>

									<span>：</span>

									<!-- 出勤時間の分のプルダウン表 宮城真奈 - Task26 -->
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMinute')} ? 'form-control errorInput' : 'form-control'"
										style="width: 60px; display: inline-block; padding: 0 2px;">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}"
											th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">
											[[${minute.value}]]
										</option>
									</select>


								</td>

								<!-- 退勤時間の時のプルダウン表 宮城真奈 - Task26 -->
								<td class="w120" style="white-space: nowrap;">

									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')} ? 'form-control errorInput' : 'form-control'"
										style="width: 60px; display: inline-block; padding: 0 2px;">
										<option th:each="hour : ${attendanceForm.hourMap}" th:value="${hour.key}"
											th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
											[[${hour.value}]]
										</option>
									</select>

									<span>：</span>

									<!-- 退勤時間の分のプルダウン表 宮城真奈 - Task26 -->
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMinute')} ? 'form-control errorInput' : 'form-control'"
										style="width: 60px; display: inline-block; padding: 0 2px;">
										<option th:each="minute : ${attendanceForm.minuteMap}" th:value="${minute.key}"
											th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">
											[[${minute.value}]]
										</option>
									</select>


								</td>
								<td class="w120">
									<select th:name="|attendanceList[${stat.index}].blankTime|"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? 'form-control errorInput' : 'form-control'">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inlne="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>


								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}"
										th:class="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? 'form-control errorInput' : 'form-control'" />


								</td>
							</tr>
						</th:block>
					</tbody>
				</table>
				</div>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" id="updateButton" />
				</div>

			</form>
		</div>
	</div>

	<script type="text/javascript" th:inline="javascript">
		/* 定時ボタン 宮城真奈 - Task.28 */
		function setDefaultTime(index) {

        // 出勤時間を09:00に設定
        document.getElementsByName(
            "attendanceList[" + index + "].trainingStartTimeHour"
        )[0].value = "9";

        document.getElementsByName(
            "attendanceList[" + index + "].trainingStartTimeMinute"
        )[0].value = "0";

        // 退勤時間を18:00に設定
        document.getElementsByName(
            "attendanceList[" + index + "].trainingEndTimeHour"
        )[0].value = "18";

        document.getElementsByName(
            "attendanceList[" + index + "].trainingEndTimeMinute"
        )[0].value = "0";
    }

		/* 更新確認プルダウン 宮城真奈 - Task.27 */
		document.getElementById("updateButton").addEventListener("click", function (event) {
			if (!confirm("更新します。よろしいですか？")) {
				event.preventDefault();
			}
		});
	</script>

</body>

</html>
